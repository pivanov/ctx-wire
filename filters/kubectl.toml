[filters.kubectl]
description = "Compact kubectl output without hiding resource payloads"
match_command = "^kubectl\\b"
strip_ansi = true
# Anchored to the resource/verb line shape kubectl actually prints
# (`deployment.apps/web configured`). The old unanchored alternation matched
# these words ANYWHERE, including inside a JSON string value, so an annotation
# reading "settings created by the platform team" collapsed an entire successful
# `-o json` response to "kubectl: ok". Every line must look like a status line,
# so a payload containing the word in prose can no longer trigger the collapse.
match_output = [
  { pattern = "(?m)\\A(?:^(?:\\S+ (?:configured|created|unchanged|deleted)|\\S+ \"[^\"]*\" successfully rolled out)$\\n?)+\\z", message = "kubectl: ok", unless = "(?i)(error|failed|forbidden|denied)" },
]
strip_lines_matching = ["^\\s*$"]
max_lines = 140

[[tests.kubectl]]
name = "apply success collapses"
input = """
deployment.apps/web configured
service/web unchanged
"""
expected = "kubectl: ok"

[[tests.kubectl]]
name = "rollout status collapses"
input = """
deployment "web" successfully rolled out
"""
expected = "kubectl: ok"

[[tests.kubectl]]
name = "json payload containing the word created is never collapsed"
input = """
{
  "kind": "ConfigMap",
  "metadata": {
    "annotations": {
      "description": "database settings created by the platform team"
    }
  },
  "data": {
    "DB_HOST": "db.prod.internal"
  }
}
"""
expected = """
{
  "kind": "ConfigMap",
  "metadata": {
    "annotations": {
      "description": "database settings created by the platform team"
    }
  },
  "data": {
    "DB_HOST": "db.prod.internal"
  }
}
"""

[[tests.kubectl]]
name = "get output preserved"
input = """
NAME      READY   STATUS
web-123   1/1     Running
"""
expected = "NAME      READY   STATUS\nweb-123   1/1     Running"

[[tests.kubectl]]
name = "apply configured but rollout timed out waiting for pods"
failed = true
input = """
deployment.apps/api configured
service/api unchanged
configmap/api-config configured
timed out waiting for the condition
"""
expected = "deployment.apps/api configured\nservice/api unchanged\nconfigmap/api-config configured\ntimed out waiting for the condition"
